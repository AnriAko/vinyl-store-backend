services:
    mysql:
        image: mysql:8.0
        container_name: nest_mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
        ports:
            - '${DB_PORT}:3306'
        volumes:
            - mysql_data:/var/lib/mysql

    redis:
        image: redis:7
        container_name: redis
        restart: always
        command:
            [
                'redis-server',
                '--requirepass',
                '${REDIS_PASSWORD}',
                '--maxmemory-policy',
                'allkeys-lru',
            ]
        env_file: .env
        ports:
            - '${REDIS_PORT}:6379'
        volumes:
            - redis_data:/data

volumes:
    mysql_data:
    redis_data:
